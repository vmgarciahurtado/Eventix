name: eventix
description: "Eventix — app de eventos."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.8.0
  webview_flutter: ^4.7.0
  app_ui_kit:
    git:
      url: https://github.com/vmgarciahurtado/app_ui_kit.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/animations/
    - assets/icons/
    - assets/images/